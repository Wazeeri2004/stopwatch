<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<h2>Dashboard</h2>

<button onclick="logout()">Logout</button>

<h3>Available Tutors</h3>
<div id="tutors"></div>
<h3>Set Availability</h3>

<input type="date" id="availDate" class="form-control mb-2">
<input type="text" id="availTime" placeholder="Time e.g 2pm" class="form-control mb-2">

<button onclick="setAvailability()" class="btn btn-success">
    Save Availability
</button>

<h3>Your Bookings (Tutor)</h3>
<div id="bookings"></div>

<script src="script.js"></script>

<script>
let user = getCurrentUser();

if (!user) {
    window.location.href = "login.html";
}

if (user.role === "student") {
    displayTutors();
} else {
    showBookings();
}
</script>

</body>
</html>
